name: Refresh monthly maintenance pull request

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: refresh-monthly-maintenance
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Find an open monthly maintenance pull request
        id: pull-request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr_number="$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --head automation/monthly-maintenance \
            --base main --state open \
            --json number --jq '.[0].number // empty')"
          echo "number=$pr_number" >> "$GITHUB_OUTPUT"
      - name: Create release GitHub App token
        if: steps.pull-request.outputs.number != ''
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Update the automation branch and preserve auto-merge
        if: steps.pull-request.outputs.number != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ steps.pull-request.outputs.number }}
        run: |
          gh pr update-branch "$PR_NUMBER" --repo "$GITHUB_REPOSITORY"
          gh pr merge "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" --auto --squash
