name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: '.flutter-version'
          cache: true
      - name: Verify package
        run: bash .github/scripts/verify.sh
      - name: Verify publication contents
        run: |
          test -f assets/country_subdivision_data/manifest.json
          test -f assets/country_subdivision_data/countries/NG.json.gz
          ! find . -path './.tool_work/*' -type f -print -quit | grep -q .
      - name: Verify no obsolete public names
        run: |
          ! rg 'world_admin_data|WorldAdminData|WorldAdminRepository|AssetWorldAdminRepository|AdministrativeArea' \
            lib test README.md CONTRIBUTING.md
